<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Страница не найдена</title>
  <link rel="stylesheet" href="data/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

  <style>
    .error-container {
      position: relative;
      text-align: center;
      padding: 100px 20px;
    }

    .error-background {
      font-size: 12rem;
      font-weight: bold;
      color: rgba(0, 0, 0, 0.08);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      user-select: none;
      pointer-events: none;
    }

    .error-message {
      position: relative;
      z-index: 1;
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .error-message a {
      display: inline-block;
      margin-top: 20px;
      font-weight: bold;
      text-decoration: none;
      color: #0066cc;
    }

    .error-message a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="data/logo.png" alt="logo">
    </div>
    <nav>
      <a href="https://domertv.github.io/meowleak">meowleak</a>
      <a href="https://domertv.github.io/about">о нас</a>
    </nav>
  </header>

  <main>
    <article class="post error-container">
      <div class="error-background">404</div>
      <div class="error-message">
        <h2>Страница не найдена</h2>
        <p>К сожалению, запрошенной страницы не существует.<br>
        Возможно, вы ошиблись в адресе или страница была удалена.</p>
        <a href="https://domertv.github.io/">Вернуться на главную</a>
      </div>
    </article>
  </main>
</body>
</html>
